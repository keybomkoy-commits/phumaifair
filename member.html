<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEMBERS // PHUMAIFAIR</title>
    <link rel="icon" id="siteFavicon" href="">
    <!-- เพิ่มฟอนต์ Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        :root {
            --bg-deep: #000000; 
            --accent: #ff3333; 
            --card-bg: rgba(15, 0, 0, 0.85);
            --border-glow: rgba(255, 0, 0, 0.3);
        }
        
        @keyframes pageFadeIn { 
            0% { opacity: 0; filter: blur(12px); transform: scale(1.05); } 
            100% { opacity: 1; filter: blur(0); transform: scale(1); } 
        }
        
        body { 
            margin: 0; padding: 0; min-height: 100vh; width: 100vw; 
            font-family: 'Kanit', sans-serif; background-color: var(--bg-deep); color: #ffffff; 
            overflow-x: hidden; display: flex; flex-direction: column; 
            
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            
            animation: pageFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        
        a, button, input[type="range"], .music-header {
            cursor: pointer;
        }

        #bg-image { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background-size: cover; background-position: center; z-index: 0; 
            /* นำ grayscale ออก เพื่อให้สีรูปพื้นหลังกลับมา */
            filter: brightness(0.3); will-change: transform; 
        }
        
        .bg-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            /* เปลี่ยนโทน Overlay เป็นดำ-แดงเข้ม */
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(40, 0, 0, 0.85) 100%); 
            z-index: 1; pointer-events: none; 
        }
        
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
        
        .container { position: relative; z-index: 3; max-width: 1200px; margin: 0 auto; padding: 40px 20px 140px; width: 100%; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 30px; }
        
        .btn-back { text-decoration: none; color: #ffcccc; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 20px; border: 1px solid rgba(255, 0, 0, 0.3); border-radius: 4px; background: rgba(20, 0, 0, 0.6); backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; gap: 8px; }
        .btn-back:hover { background: rgba(255, 0, 0, 0.2); color: #fff; border-color: #ff3333; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);}
        
        .member-counter { font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; color: #ffcccc; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; background: rgba(20, 0, 0, 0.6); padding: 8px 16px; border-radius: 4px; border: 1px solid rgba(255, 0, 0, 0.3); text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);}
        
        .header-title-box { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 40px; }
        
        @keyframes titleBreath {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.15)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 45px rgba(255, 0, 0, 0.9)); }
        }

        .page-title { 
            font-family: 'Cinzel Decorative', serif; 
            font-size: clamp(2.2rem, 6vw, 4.5rem); 
            letter-spacing: 0.08em; 
            margin: 0; 
            font-weight: 900; 
            text-transform: uppercase; 
            position: relative;
            background: linear-gradient(90deg, rgba(100,0,0,0.8) 0%, rgba(255,0,0,1) 45%, #ff3333 50%, rgba(255,0,0,1) 55%, rgba(100,0,0,0.8) 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1.5px rgba(180, 0, 0, 0.7); 
            animation: textShine 4s cubic-bezier(0.4, 0, 0.2, 1) infinite, titleBreath 5s ease-in-out infinite;
        }

        .page-title::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: #ffffff; 
            -webkit-text-stroke: 0px transparent; 
            z-index: 1;
            pointer-events: none;
            background: none;
            -webkit-text-fill-color: #ffffff;
            opacity: 0.15;
        }

        @keyframes textShine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .page-subtitle { font-family: 'Kanit', sans-serif; font-size: 0.8rem; color: #ff6666; letter-spacing: 0.3em; margin-top: 15px; text-transform: uppercase; font-weight: 500; opacity: 0.8;}
        
        .search-container { width: 100%; margin-bottom: 55px; display: flex; justify-content: center; }
        .search-box { width: 100%; max-width: 580px; position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 20px; width: 18px; height: 18px; fill: #ff6666; pointer-events: none; opacity: 0.7;}
        
        .search-box input { width: 100%; padding: 18px 120px 18px 55px; box-sizing: border-box; background: rgba(15, 0, 0, 0.8); border: 1px solid rgba(255, 0, 0, 0.3); border-radius: 4px; color: #fff; font-family: 'Kanit', sans-serif; font-size: 0.95rem; outline: none; backdrop-filter: blur(10px); letter-spacing: 0.1em; transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); caret-color: #ff3333; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);}
        
        .search-box input:focus { border-color: #ff3333; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(0,0,0,0.8); }
        .search-btn { position: absolute; right: 6px; background: rgba(255, 0, 0, 0.1); color: #ffcccc; border: 1px solid rgba(255, 0, 0, 0.3); padding: 12px 25px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.3s; letter-spacing: 0.1em;}
        .search-btn:hover { background: #ff0000; color: #fff; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        
        .category-section { width: 100%; margin-bottom: 50px; display: none; }
        .category-section.has-data { display: block; animation: fadeInGroup 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInGroup { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .category-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .category-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.6), transparent); }
        .category-title { font-family: 'Cinzel Decorative', serif; font-size: 1.8rem; letter-spacing: 0.15em; margin: 0; text-transform: uppercase; font-weight: 900; color: #ff3333; text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);}
        .cat-badge-count { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; background: rgba(255, 0, 0, 0.1); padding: 4px 12px; border-radius: 4px; color: #ffcccc; border: 1px solid rgba(255, 0, 0, 0.4); margin-left: 10px; font-weight: 700;}
        
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; justify-content: center; width: 100%; }
        
        /* ------------------------------------- */
        /* --- DYNAMIC GLOWING MEMBER CARD --- */
        /* ------------------------------------- */
        .member-card { 
            background: transparent; 
            border-radius: 6px; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            gap: 18px; 
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            z-index: 1;
            /* ตัวแปรสีพื้นฐานเปลี่ยนเป็นโทนแดงดุดัน */
            --card-color: #ff3333; 
            --card-color-glow: rgba(255, 51, 51, 0.4);
        }

        /* กำหนดสีแยกตามยศ (Role) */
        .member-card[data-role="FOUNDERS"] { 
            --card-color: #ffd700; 
            --card-color-glow: rgba(255, 215, 0, 0.4); 
        } 
        .member-card[data-role="LEADERS"] { 
            --card-color: #ff8800; 
            --card-color-glow: rgba(255, 136, 0, 0.4); 
        }  
        .member-card[data-role="SUPPORT & BY"] { 
            --card-color: #ff0044; 
            --card-color-glow: rgba(255, 0, 68, 0.4); 
        } 
        .member-card[data-role="MEMBERS"] { 
            --card-color: #00ff44; 
            --card-color-glow: rgba(0, 255, 68, 0.4); 
        }

        /* เอฟเฟกต์ไฟวิ่งล้อมรอบ (Spinning Glow) */
        .member-card::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 150%; height: 500%; 
            background: conic-gradient(from 0deg, transparent 70%, var(--card-color) 100%);
            transform: translate(-50%, -50%) rotate(0deg);
            animation: cardBorderSpin 4s linear infinite;
            z-index: 0;
            opacity: 0.7;
        }

        /* พื้นหลังสีดำปิดทับด้านในการ์ด (ให้เห็นแค่ขอบไฟวิ่ง) */
        .member-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgba(15, 0, 0, 0.95); /* พื้นหลังในการ์ดเป็นดำแดง */
            border-radius: 4px;
            z-index: 1;
        }

        @keyframes cardBorderSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Hover Effect */
        .member-card:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 20px var(--card-color-glow);
        }

        .member-card:hover::before {
            animation: cardBorderSpin 1.5s linear infinite; 
            opacity: 1;
            background: conic-gradient(from 0deg, transparent 40%, var(--card-color) 100%);
        }

        .member-avatar { 
            width: 65px; height: 65px; border-radius: 4px; background-color: #111111; object-fit: cover; 
            border: 2px solid rgba(255, 255, 255, 0.2); flex-shrink: 0; position: relative; z-index: 2;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .member-card:hover .member-avatar { 
            border-color: var(--card-color); 
            transform: scale(1.08) rotate(3deg);
            box-shadow: 0 0 15px var(--card-color-glow);
        }
        
        .member-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2;}
        
        .member-name { 
            font-size: 1.15rem; font-weight: 600; margin: 0 0 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Kanit', sans-serif; color: #fff; letter-spacing: 0.05em; transition: all 0.4s ease;
        }
        
        .member-card:hover .member-name {
            color: #ffffff;
            text-shadow: 0 0 12px var(--card-color);
        }

        .role-tag { 
            display: inline-block; font-size: 0.65rem; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 0.1em; width: fit-content; 
            background: rgba(0,0,0,0.6); 
            color: var(--card-color); 
            border: 1px solid var(--card-color-glow); 
            transition: all 0.4s ease;
        }
        
        .member-card:hover .role-tag {
            background: var(--card-color-glow);
            border-color: var(--card-color);
            color: #ffffff;
            box-shadow: 0 0 10px var(--card-color-glow);
        }

        .fb-btn { 
            width: 40px; height: 40px; border-radius: 4px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); flex-shrink: 0; 
            background: rgba(0,0,0,0.5); 
            color: var(--card-color); 
            border: 1px solid var(--card-color-glow); 
            position: relative; z-index: 2; overflow: hidden;
        }
        
        .fb-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s ease;
        }

        .fb-btn:hover { 
            background: var(--card-color); 
            color: #000; 
            box-shadow: 0 0 15px var(--card-color); 
            border-color: var(--card-color); 
            transform: scale(1.08);
        }
        .fb-btn:hover::before { left: 100%; }
        /* ------------------------------------- */

        .no-results { text-align: center; color: #ff6666; padding: 40px; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; display: none; text-transform: uppercase; letter-spacing: 0.1em;}

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 40px; width: 100%; }
        .page-btn { background: rgba(20, 0, 0, 0.6); border: 1px solid rgba(255, 0, 0, 0.3); color: #ffcccc; padding: 10px 25px; border-radius: 4px; cursor: pointer; transition: 0.3s; font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.1em; }
        .page-btn:hover:not(:disabled) { background: #ff0000; color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5);}
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; background: rgba(0,0,0,0.5);}
        .page-info { font-size: 0.9rem; color: #ff6666; letter-spacing: 0.1em; font-family: 'Rajdhani', sans-serif; font-weight: 600;}

        /* Widget เพลง ธีมปีศาจแดง */
        .music-widget {
            position: fixed; bottom: clamp(10px, 2vh, 20px); right: clamp(10px, 2vw, 20px); 
            background: rgba(15, 0, 0, 0.85);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 0, 0, 0.25); border-radius: 4px; 
            width: clamp(240px, 50vw, 280px); z-index: 99999; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.95);
        }
        .music-widget.collapsed { height: 55px; }
        .music-widget.expanded { height: 110px; border-color: rgba(255,0,0,0.6); box-shadow: 0 15px 35px rgba(0,0,0,0.95), 0 0 20px rgba(255,0,0,0.2); }
        .music-header { display: flex; align-items: center; padding: 8px 12px; height: 55px; box-sizing: border-box; }
        .cover-wrapper { position: relative; width: 34px; height: 34px; margin-right: 10px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 1.5px solid rgba(255, 0, 0, 0.4); animation: spinRecord 5s linear infinite; animation-play-state: paused;
            -webkit-user-drag: none; filter: grayscale(100%); transition: 0.3s;
        }
        .playing .music-cover { animation-play-state: running; border-color: #ff3333; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.4rem; color: #ff6666; letter-spacing: 0.2em; font-weight: 700; font-family: 'Rajdhani', sans-serif;}
        .music-title { font-family: 'Kanit', sans-serif; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .music-link { font-size: 0.45rem; color: #aaaaaa; text-decoration: none; font-family: 'Rajdhani', sans-serif; transition: 0.3s;}
        .music-link:hover { color: #ff3333; }
        .toggle-icon { font-size: 0.5rem; color: #ff3333; padding: 4px; transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .music-controls { display: flex; align-items: center; padding: 0 14px 10px 14px; gap: 12px; opacity: 0; transition: opacity 0.4s; border-top: 1px solid rgba(255, 0, 0, 0.2); background: rgba(0,0,0,0.7); }
        .music-widget.expanded .music-controls { opacity: 1; }
        .ctrl-btn { background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); color: #ff3333; width: 26px; height: 26px; border-radius: 4px; font-size: 0.75rem; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);}
        .ctrl-btn:hover { background: rgba(255, 0, 0, 0.3); color: #fff; transform: scale(1.1); box-shadow: 0 0 12px rgba(255,0,0,0.4); }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,0,0,0.05); padding: 2px 8px; border-radius: 4px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 2px; background: rgba(255, 0, 0, 0.3); outline: none; transition: 0.3s;}
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 0; background: #ff3333; box-shadow: 0 0 10px rgba(255, 0, 0, 0.8); transform: rotate(45deg); cursor: pointer; transition: 0.2s; }
        .vol-slider::-webkit-slider-thumb:hover { transform: rotate(45deg) scale(1.3); background: #ffffff;}

        .footer-credit { position: relative; z-index: 3; width: 100%; text-align: center; padding: 20px 0; font-size: clamp(0.5rem, 1.2vw, 0.6rem); color: #ff6666; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; margin-top: auto; font-family: 'Rajdhani', sans-serif;}
        .secret-admin-link { color: #cccccc; text-decoration: none; transition: 0.3s; font-family: 'Kanit', sans-serif;}
        .secret-admin-link:hover { color: #ffffff; text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);}
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="btn-back"><span>‹</span> BACK</a>
            <div id="totalMembersBadge" class="member-counter">0 MEMBERS</div>
        </div>
        <div class="header-title-box">
            <h1 id="dynMemberTitle" class="page-title" data-text="PHUMAIFAIR">PHUMAIFAIR</h1>
            <div id="dynMemberSubTitle" class="page-subtitle">PHUMAIFAIR</div>
        </div>
        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71 20.29l-5.005-5.005C17.79 13.785 18.5 11.977 18.5 10c0-4.694-4.306-8.5-9.5-8.5S-0.5 5.306-0.5 10s4.306 8.5 9.5 8.5c1.977 0 3.785-.71 5.285-1.795l5.005 5.005c.39.39 1.024.39 1.414 0 .39-.39.39-1.024 0-1.414zM9 16c-3.314 0-6-2.686-6-6s2.686-6 6-6 6 2.686 6 6-2.686 6-6 6z"/></svg>
                <input type="text" id="searchInput" placeholder="Search members..." autocomplete="off" spellcheck="false">
                <button class="search-btn" id="searchBtn">SEARCH</button>
            </div>
        </div>
        <div id="noResults" class="no-results">-- NO MEMBERS FOUND --</div>
        <div id="categoryContainer" style="width: 100%;"></div>
    </div>

    <div id="musicWidget" class="music-widget collapsed">
        <div class="music-header" id="toggleMusicBtn">
            <div class="cover-wrapper">
                <img id="musicCover" class="music-cover" src="https://placehold.co/100x100/111/444?text=🎵" alt="Cover">
            </div>
            <div class="music-info-mini">
                <span class="music-label">AUDIO STREAM</span>
                <div id="musicTitle" class="music-title">Unknown Track</div>
                <a id="musicLink" class="music-link" href="#" target="_blank">SOURCE LINK</a>
            </div>
            <div id="toggleIcon" class="toggle-icon">▲</div>
        </div>
        <div class="music-controls">
            <button id="playPauseBtn" class="ctrl-btn">▶</button>
            <div class="vol-wrapper">
                <span class="vol-icon" style="font-size:0.4rem; color:#ff6666;">VOL</span>
                <input type="range" id="volumeSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>
        <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <footer class="footer-credit">
        SYSTEM DESIGN BY QA QEN <span style="opacity: 0.3; margin: 0 8px;">|</span> <a href="admin.html" class="secret-admin-link">PANEL</a>
    </footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            initParticles(); 
        }
        window.addEventListener('resize', resizeCanvas); 

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5; 
                
                this.speedX = Math.random() * 4 + 1; 
                this.speedY = (Math.random() - 0.5) * 1.5; 
                
                this.opacity = Math.random() * 0.5 + 0.1;
                this.baseOpacity = this.opacity;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                
                this.opacity = this.baseOpacity + Math.sin(Date.now() * this.pulseSpeed) * 0.2;
                if(this.opacity < 0) this.opacity = 0;
                
                if (this.x > canvas.width) this.x = 0; 
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; 
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                // เปลี่ยนสีอนุภาคเป็นโทนแดงสว่าง/แดงเลือดหมู
                ctx.fillStyle = Math.random() > 0.5 
                    ? `rgba(255, 30, 30, ${this.opacity})` 
                    : `rgba(180, 0, 0, ${this.opacity - 0.1})`; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 7000);
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        resizeCanvas();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAghtsxq9DA_z_kCZXT0dcGj14rbhjq5-I",
            authDomain: "phumaifair.firebaseapp.com",
            projectId: "phumaifair",
            storageBucket: "phumaifair.firebasestorage.app",
            messagingSenderId: "281607111790",
            appId: "1:281607111790:web:0fddc0afa955e5160a127f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const categoriesConfig = [
            { id: 'found', name: 'FOUNDERS', roleKey: 'FOUNDERS' },
            { id: 'lead', name: 'LEADERS', roleKey: 'LEADERS' },
            { id: 'supp', name: 'SUPPORT & BY', roleKey: 'SUPPORT & BY' },
            { id: 'memb', name: 'MEMBERS', roleKey: 'MEMBERS' }
        ];

        let membersData = [];
        let globalDefaultAvatar = 'https://placehold.co/150/111/fff?text=NO+IMG';

        let currentMemberPage = 1;
        const membersPerPage = 10;

        const container = document.getElementById('categoryContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const totalMembersBadge = document.getElementById('totalMembersBadge');

        function initCategoryContainers() {
            container.innerHTML = '';
            categoriesConfig.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = `section-${cat.id}`;
                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-line"></div>
                        <h2 class="category-title">${cat.name} <span class="cat-badge-count" id="count-${cat.id}">00</span></h2>
                        <div class="category-line"></div>
                    </div>
                    <div class="member-grid" id="grid-${cat.id}"></div>
                    <div id="pagination-${cat.id}" class="pagination-container" style="display: none;"></div>
                `;
                container.appendChild(section);
            });
        }

        function renderMembers(dataToRender, searchTerm = "") {
            categoriesConfig.forEach(cat => {
                document.getElementById(`grid-${cat.id}`).innerHTML = '';
                document.getElementById(`section-${cat.id}`).classList.remove('has-data');
                document.getElementById(`pagination-${cat.id}`).style.display = 'none';
            });

            const filteredData = dataToRender.filter(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()));
            noResults.style.display = filteredData.length === 0 ? 'block' : 'none';
            totalMembersBadge.innerText = `${filteredData.length} MEMBERS`;

            categoriesConfig.forEach(cat => {
                const groupList = filteredData.filter(m => m.role.toUpperCase() === cat.roleKey.toUpperCase());
                if (groupList.length > 0) {
                    const grid = document.getElementById(`grid-${cat.id}`);
                    const section = document.getElementById(`section-${cat.id}`);
                    const pagination = document.getElementById(`pagination-${cat.id}`);
                    document.getElementById(`count-${cat.id}`).innerText = groupList.length < 10 ? `0${groupList.length}` : groupList.length;

                    let listToRender = groupList;
                    const isMembersCat = cat.roleKey.toUpperCase() === 'MEMBERS';

                    if (isMembersCat) {
                        const totalPages = Math.ceil(groupList.length / membersPerPage);
                        if (currentMemberPage > totalPages && totalPages > 0) currentMemberPage = totalPages;
                        
                        listToRender = groupList.slice((currentMemberPage - 1) * membersPerPage, currentMemberPage * membersPerPage);
                        
                        if (totalPages > 1) {
                            pagination.style.display = 'flex';
                            pagination.innerHTML = `
                                <button class="page-btn" id="prevPageBtn" ${currentMemberPage === 1 ? 'disabled' : ''}>PREV</button>
                                <span class="page-info">PAGE ${currentMemberPage} OF ${totalPages}</span>
                                <button class="page-btn" id="nextPageBtn" ${currentMemberPage === totalPages ? 'disabled' : ''}>NEXT</button>
                            `;

                            document.getElementById('prevPageBtn').addEventListener('click', () => {
                                if (currentMemberPage > 1) {
                                    currentMemberPage--;
                                    renderMembers(dataToRender, searchTerm);
                                    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                }
                            });
                            
                            document.getElementById('nextPageBtn').addEventListener('click', () => {
                                if (currentMemberPage < totalPages) {
                                    currentMemberPage++;
                                    renderMembers(dataToRender, searchTerm);
                                    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                }
                            });
                        }
                    }

                    listToRender.forEach(member => {
                        const card = document.createElement('div');
                        card.className = `member-card`;
                        card.setAttribute('data-role', member.role.toUpperCase());
                        
                        const avatarUrl = (member.avatar && member.avatar.trim() !== "") ? member.avatar : globalDefaultAvatar;
                        card.innerHTML = `
                            <img src="${avatarUrl}" class="member-avatar" alt="${member.name}">
                            <div class="member-info">
                                <h3 class="member-name" title="${member.name}">${member.name}</h3>
                                <span class="role-tag">${member.role}</span>
                            </div>
                            <a href="${member.facebookUrl || '#'}" target="_blank" class="fb-btn" title="Facebook Profile">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                    section.classList.add('has-data');
                }
            });
        }

        initCategoryContainers();

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true'); 
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const config = docSnap.data();
                if (config.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${config.bgUrl}')`;
                if (config.faviconUrl) document.getElementById('siteFavicon').href = config.faviconUrl;
                
                if (config.mainTitle) {
                    const mTitle = document.getElementById('dynMemberTitle');
                    mTitle.innerText = config.mainTitle;
                    mTitle.setAttribute('data-text', config.mainTitle);
                }
                
                if (config.subTitle) document.getElementById('dynMemberSubTitle').innerText = config.subTitle;
                if (config.defaultAvatar) globalDefaultAvatar = config.defaultAvatar;
                if (config.musicTitle) document.getElementById('musicTitle').innerText = config.musicTitle;
                if (config.musicLinkText) document.getElementById('musicLink').innerText = config.musicLinkText;
                if (config.musicLinkUrl) document.getElementById('musicLink').href = config.musicLinkUrl;
                if (config.musicCoverUrl) document.getElementById('musicCover').src = config.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "members"), (snapshot) => {
            let firebaseMembers = [];
            snapshot.forEach(doc => { firebaseMembers.push({ id: doc.id, ...doc.data() }); });
            
            // เรียงลำดับสมาชิก (จากเลขน้อยไปมาก)
            firebaseMembers.sort((a, b) => (a.order || 999) - (b.order || 999));

            membersData = firebaseMembers;
            renderMembers(membersData, searchInput.value);
        });

        searchInput.addEventListener('input', (e) => { 
            currentMemberPage = 1; 
            renderMembers(membersData, e.target.value); 
        });
        document.getElementById('searchBtn').addEventListener('click', () => { 
            currentMemberPage = 1; 
            renderMembers(membersData, searchInput.value); 
        });
    </script>
</body>
</html>
