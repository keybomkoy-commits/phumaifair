<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHUMAIFAIR</title>
    <link rel="icon" id="siteFavicon" href="">
    <!-- เพิ่มฟอนต์ Cinzel Decorative สำหรับความคมเข้มสไตล์ปีศาจซาตาน -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(12px); transform: scale(1.05); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Kanit', sans-serif; 
            background-color: #000000; 
            color: #ffffff;
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            
            animation: pageFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        a, button, input[type="range"], .music-header {
            cursor: pointer;
        }

        /* ตั้งค่าวิดีโอและภาพพื้นหลัง */
        #bg-video, #bg-image {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            object-fit: cover;
            z-index: 0; 
            pointer-events: none;
            display: none;
        }

        #bg-image {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(40, 0, 0, 0.85) 100%);
            z-index: 1; pointer-events: none;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: clamp(15px, 3vh, 30px); box-sizing: border-box; width: 100%;
            overflow-y: auto;
        }

        /* เอฟเฟกต์แสงวิ่งตัวหนังสือหลัก */
        @keyframes textShine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        
        @keyframes titleBreath {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.15)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 45px rgba(255, 0, 0, 0.9)); }
        }

        .asus-title {
            /* ใช้ฟอนต์ Cinzel Decorative คมๆ สไตล์ซาตาน/ดาร์กแฟนตาซี */
            font-family: 'Cinzel Decorative', serif; 
            font-size: clamp(2.2rem, 6vw, 4.8rem);
            letter-spacing: 0.08em; 
            margin: 0 0 clamp(15px, 3vh, 30px) 0; 
            font-weight: 900; /* หนาสุดให้ดูดุดัน */
            text-transform: uppercase; 
            text-align: center;
            z-index: 4;
            position: relative;
            
            /* แสงสว่างวิ่งผ่านตรงกลางตัวหนังสือ โทนแดง-เลือดหมู */
            background: linear-gradient(90deg, rgba(100,0,0,0.8) 0%, rgba(255,0,0,1) 45%, #ff3333 50%, rgba(255,0,0,1) 55%, rgba(100,0,0,0.8) 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1.5px rgba(180, 0, 0, 0.7); /* ขอบสีแดงเข้มให้คมขึ้น */
            
            animation: textShine 4s cubic-bezier(0.4, 0, 0.2, 1) infinite, titleBreath 5s ease-in-out infinite;
        }

        .asus-title::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: #ffffff; 
            -webkit-text-stroke: 0px transparent; 
            z-index: 1;
            pointer-events: none;
            background: none;
            -webkit-text-fill-color: #ffffff;
            opacity: 0.15; /* ให้มีเงาซ้อนบางๆ */
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); filter: drop-shadow(0 15px 25px rgba(255,0,0,0.3)); }
        }

        @keyframes borderSpin {
            100% { transform: rotate(360deg); }
        }

        .emblem-container {
            position: relative; 
            width: clamp(180px, 28vw, 320px); 
            height: clamp(180px, 28vw, 320px);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: clamp(15px, 3vh, 30px); flex-shrink: 0;
            animation: logoFloat 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            will-change: transform;
            
            background: transparent; 
            border-radius: 50%;
            padding: clamp(15px, 3vw, 30px);
            box-sizing: border-box;
            box-shadow: 0 0 40px rgba(100,0,0,0.4) inset, 0 0 20px rgba(0,0,0,0.8) inset; 
        }

        .emblem-container::before {
            content: '';
            position: absolute;
            inset: -3px; 
            border-radius: 50%;
            padding: 3px; 
            /* ปรับเส้นแสงให้ดูสมูท หางยาว ไล่แสงเนียนขึ้น โทนแดง */
            background: conic-gradient(from 0deg, transparent 20%, rgba(150,0,0,0.5) 60%, rgba(255,0,0,0.9) 95%, #ff0000 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude; 
            animation: borderSpin 2.5s linear infinite;
            z-index: -1; 
        }

        .main-logo {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.5)); z-index: 2;
            pointer-events: none;
            -webkit-user-drag: none;
            transition: filter 0.5s ease;
        }

        .btn-container {
            display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 400px; z-index: 10;
        }

        /* เงากะพริบสำหรับปุ่มหลัก */
        @keyframes buttonPulseShadow {
            0%, 100% { box-shadow: 0 10px 25px rgba(0,0,0,0.9), 0 0 10px rgba(255,0,0,0.2); }
            50% { box-shadow: 0 10px 25px rgba(0,0,0,0.9), 0 0 25px rgba(255,0,0,0.5); }
        }

        /* แสงวิ่งพาดเฉียง (Flare effect) */
        @keyframes flareSweep {
            0% { left: -150%; }
            100% { left: 200%; }
        }

        .btn-members {
            width: 100%; text-decoration: none; 
            background: rgba(15, 0, 0, 0.85); 
            border: 1px solid rgba(255, 0, 0, 0.3); 
            border-radius: 4px;
            padding: clamp(14px, 2vh, 18px) 0;
            color: #ffffff; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 700; 
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            text-transform: uppercase; letter-spacing: 0.25em; 
            display: flex; justify-content: center; align-items: center; gap: 15px;
            backdrop-filter: blur(12px); 
            box-sizing: border-box;
            position: relative; overflow: hidden;
            
            /* อนิเมชั่นเงาหายใจ + transition สมูทๆ */
            animation: buttonPulseShadow 4s ease-in-out infinite;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        /* แสงสะท้อนวิ่งผ่านปุ่ม */
        .btn-members::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 50, 50, 0.4), transparent);
            transform: skewX(-25deg);
            animation: flareSweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
            z-index: 1;
        }

        /* เส้นแสงอ่อนๆ ขอบบน */
        .btn-members::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,0.8), transparent);
            opacity: 0.5;

        .btn-members span {

            background: rgba(40, 0, 0, 0.95); 
            border-color: #ff0000;
            transform: translateY(-4px) scale(1.02); 
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,0,0,1);
            /* หยุดเงากะพริบ แล้วขยายเงาตอน hover ด้วยสีแดง */
            animation: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.95), 0 0 40px rgba(255, 0, 0, 0.7);
        }

        .partner-section-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.5vh, 12px); 
            width: 100%; max-width: 600px; z-index: 10; margin-top: clamp(15px, 3vh, 25px);
        }
        
        .partner-heading {
            font-family: 'Rajdhani', sans-serif; 
            font-size: clamp(0.7rem, 1.2vw, 0.85rem); 
            letter-spacing: 0.35em; 
            color: #ff6666; /* เปลี่ยนสีหัวข้อพาร์ทเนอร์ให้เข้าธีม */
            text-transform: uppercase;
        }

            flex-wrap: wrap;
            justify-content: center;
            gap: 12px; 
            width: 100%;
        }

            0% { left: -150%; }
            100% { left: 200%; }
        }

        .partner-btn {
            text-decoration: none; 
            background: rgba(20, 0, 0, 0.7); 
            border: 1px solid rgba(255, 0, 0, 0.2); 
            border-radius: 4px; 
            padding: clamp(8px, 1.2vh, 12px) clamp(16px, 3vw, 24px); 
            color: #cccccc; 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: 600; 
            font-size: clamp(0.85rem, 1.2vw, 0.95rem);
            text-transform: uppercase; 
            letter-spacing: 0.15em;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
            min-width: 110px; 
            backdrop-filter: blur(8px);
        }

        .partner-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 50, 50, 0.2), transparent);
            transform: skewX(-20deg);
            animation: partnerSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            pointer-events: none;
            z-index: 1;
        }
        
        .partner-btn span {
            position: relative; z-index: 2;
        }

        .partner-btn:hover {
            background: rgba(60, 0, 0, 0.9); 
            border-color: rgba(255, 50, 50, 0.8); 
            color: #ffffff;
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.8), 0 0 20px rgba(255, 0, 0, 0.6);
            text-shadow: 0 0 10px rgba(255,0,0,0.8);
        }

        /* Widget เพลง */
        .music-widget {
            position: fixed; bottom: clamp(10px, 2vh, 20px); right: clamp(10px, 2vw, 20px); 
            background: rgba(15, 0, 0, 0.85);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 0, 0, 0.25); border-radius: 4px; 
            width: clamp(240px, 50vw, 280px); z-index: 99999; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.95);
        }
        .music-widget.collapsed { height: 55px; }
        .music-widget.expanded { height: 110px; border-color: rgba(255,0,0,0.6); box-shadow: 0 15px 35px rgba(0,0,0,0.95), 0 0 20px rgba(255,0,0,0.2); }
        .music-header { display: flex; align-items: center; padding: 8px 12px; height: 55px; box-sizing: border-box; }
        .cover-wrapper { position: relative; width: 34px; height: 34px; margin-right: 10px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 1.5px solid rgba(255, 0, 0, 0.4); animation: spinRecord 5s linear infinite; animation-play-state: paused;
            -webkit-user-drag: none; filter: grayscale(100%); transition: 0.3s;
        }
        .playing .music-cover { animation-play-state: running; border-color: #ff3333; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.4rem; color: #ff6666; letter-spacing: 0.2em; font-weight: 700; font-family: 'Rajdhani', sans-serif;}
        .music-title { font-family: 'Kanit', sans-serif; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .music-link { font-size: 0.45rem; color: #aaaaaa; text-decoration: none; font-family: 'Rajdhani', sans-serif; transition: 0.3s;}
        .music-link:hover { color: #ff3333; }
        .toggle-icon { font-size: 0.5rem; color: #ff3333; padding: 4px; transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .music-controls { display: flex; align-items: center; padding: 0 14px 10px 14px; gap: 12px; opacity: 0; transition: opacity 0.4s; border-top: 1px solid rgba(255, 0, 0, 0.2); background: rgba(0,0,0,0.7); }
        .music-widget.expanded .music-controls { opacity: 1; }
        .ctrl-btn { background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); color: #ff3333; width: 26px; height: 26px; border-radius: 4px; font-size: 0.75rem; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);}
        .ctrl-btn:hover { background: rgba(255, 0, 0, 0.3); color: #fff; transform: scale(1.1); box-shadow: 0 0 12px rgba(255,0,0,0.4); }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,0,0,0.05); padding: 2px 8px; border-radius: 4px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 2px; background: rgba(255, 0, 0, 0.3); outline: none; transition: 0.3s;}
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 0; background: #ff3333; box-shadow: 0 0 10px rgba(255, 0, 0, 0.8); transform: rotate(45deg); cursor: pointer; transition: 0.2s; }
        .vol-slider::-webkit-slider-thumb:hover { transform: rotate(45deg) scale(1.3); background: #ffffff; }

        .footer-credit {
            position: relative; z-index: 3; width: 100%; text-align: center; padding: clamp(10px, 2vh, 15px) 0;
            font-size: clamp(0.5rem, 1.2vw, 0.6rem); color: #ff6666; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 10px; flex-shrink: 0;
            font-family: 'Rajdhani', sans-serif;
        }
        .footer-link-web { color: #cccccc; text-decoration: none; transition: all 0.3s ease; font-family: 'Kanit', sans-serif; }
        .footer-link-web:hover { color: #ffffff; text-shadow: 0 0 10px rgba(255, 0, 0, 0.8); transform: translateY(-1px);}
    </style>
</head>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            initParticles(); 
        }
        window.addEventListener('resize', resizeCanvas); 

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5; 
                
                this.speedX = Math.random() * 4 + 1; 
                this.speedY = (Math.random() - 0.5) * 1.5; 
                
                this.opacity = Math.random() * 0.5 + 0.1;
                this.baseOpacity = this.opacity;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                
                this.opacity = this.baseOpacity + Math.sin(Date.now() * this.pulseSpeed) * 0.2;
                if(this.opacity < 0) this.opacity = 0;
                
                if (this.x > canvas.width) this.x = 0; 
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; 
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = Math.random() > 0.5 
                    ? `rgba(255, 30, 30, ${this.opacity})` 
                    : `rgba(180, 0, 0, ${this.opacity - 0.1})`; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 7000);
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        resizeCanvas();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                
                // จัดการตั้งค่าพื้นหลังตาม Admin (รองรับทั้ง bgVideoUrl และ bgUrl)
                const bgVideo = document.getElementById('bg-video');
                const bgImage = document.getElementById('bg-image');

                if (cfg.bgVideoUrl && cfg.bgVideoUrl.trim() !== "") {
                    bgVideo.innerHTML = `<source src="${cfg.bgVideoUrl}" type="video/mp4">`;
                    bgVideo.load();
                    bgVideo.style.display = 'block';
                    bgImage.style.display = 'none';
                } else if (cfg.bgUrl && cfg.bgUrl.trim() !== "") {
                    bgImage.style.backgroundImage = `url('${cfg.bgUrl}')`;
                    bgImage.style.display = 'block';
                    bgVideo.style.display = 'none';
                } else {
                    // ค่าเริ่มต้นกรณีไม่มีการตั้งค่า
                    bgVideo.style.display = 'none';
                    bgImage.style.display = 'none';
                }

                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "partners"), (snapshot) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            if (snapshot.empty) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                
                const span = document.createElement('span');
                span.innerText = p.name;
                a.appendChild(span);
                
                partnerGroup.appendChild(a);
            });
        });
    </script>
</body>
</html>
